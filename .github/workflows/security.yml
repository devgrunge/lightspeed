name: Security Audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Run weekly to catch newly-published advisories even without code changes
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── cargo deny ──────────────────────────────────────────────────────────────
  # Enforces license compliance, bans known-bad crates, detects duplicate
  # dependency versions, and checks every dependency against the RustSec
  # Advisory Database.  Configuration lives in deny.toml at the repo root, which
  # is the single source of truth for advisory accepts/ignores; a standalone
  # `cargo audit` job bypasses deny.toml and caused recurring false failures, so
  # cargo-deny is the one advisory gate.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Run all checks defined in deny.toml
          command: check
          # Use the deny.toml at the workspace root
          manifest-path: Cargo.toml
          # Surface all issues rather than stopping at first failure
          arguments: --all-features
